name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two deploys at once; a second push waits for the first to finish.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          # Fail with a clear annotation instead of a bare exit code (secret values
          # themselves are never printed; GitHub masks them anyway).
          if [ -z "${{ secrets.EC2_HOST }}" ]; then echo "::error::The EC2_HOST secret is missing or empty"; exit 1; fi
          if [ -z "${{ secrets.EC2_USER }}" ]; then echo "::error::The EC2_USER secret is missing or empty"; exit 1; fi
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then echo "::error::The EC2_SSH_KEY secret is missing or empty"; exit 1; fi
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keyscan -T 10 -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts; then
            echo "::error::ssh-keyscan could not reach EC2_HOST on port 22 - wrong IP or security group blocks GitHub"
            exit 1
          fi
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::EC2_SSH_KEY is not a valid private key - the paste was likely mangled; re-copy the whole key including the BEGIN and END lines"
            exit 1
          fi

      - name: Deploy to EC2
        run: |
          set +e
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 -o BatchMode=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "APP_DIR='${{ vars.APP_DIR }}' bash -s" < scripts/deploy.sh
          code=$?
          set -e
          if [ "$code" -eq 255 ]; then
            echo "::error::SSH could not log in - check that EC2_USER is right and the deploy key's .pub line is in ~/.ssh/authorized_keys on the server"
            exit 1
          elif [ "$code" -ne 0 ]; then
            echo "::error::deploy.sh failed on the server with exit code $code - check the step log"
            exit "$code"
          fi
